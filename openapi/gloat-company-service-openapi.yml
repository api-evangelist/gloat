tags:
- name: Data direct
  description: 'The Data Sharing API provides endpoints for accessing and downloading your Gloat data.

    The API enables to retrieve lists of available file types and generate pre-signed URLs for downloading specific data files.

    Note that in order to access use this API you''ll need to create an API key via the Admin area and contact your Gloat representative to ask for permissions for the Data Direct API.'
- name: API keys
  description: 'API keys management endpoints for creating, updating, and managing API keys.

    These endpoints require the external_api_token_management permission.'
- name: Integration uploads
  description: Presigned HTTPS PUT URLs for uploading files to the integration (e.g. Boomi) S3 bucket under your company prefix. Requires the upload_users permission. Configure INTEGRATION_UPLOADS_BUCKET and IRSA s3:PutObject on that bucket.
