      summary: Get users by permission
      description: Return all users who have this permission (direct or dynamic).
      operationId: get_permission_users_api_authorization_v1_permissions__permission__users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: permission
        in: path
        required: true
        schema:
          type: string
          description: The permission name
          title: Permission
        description: The permission name
      - name: assignment_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RoleAssignmentType'
          description: Filter by user assignment type (Dynamic, Direct, or All)
          default: All
