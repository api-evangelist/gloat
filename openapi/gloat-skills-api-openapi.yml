servers:
- url: https://api.gloat.com/api/v2
security:
- ApiKeyAuth: []
tags:
- name: Skills
paths:
  /skills:
    post:
      tags:
      - Skills
      summary: Skills by users IDs
      description: Post skills to gloat
      operationId: postSkills
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor:
                  type: string
                  example: vendor
                ontologyName:
                  type: string
                  example: ontology
                entities:
                  type: array
                  items:
                    $ref: '#/components/schemas/post_skill'
        required: true
      responses:
        '200':
          description: successful operation
        '400':
          description: bad request
        '500':
          description: internal problem
components:
  schemas:
    post_skill:
      type: object
      properties:
        id:
          type: string
        names:
          type: object
          properties:
            en:
              type: array
              items:
                type: string
                example: skill_name
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-Gloat-API-Key
      in: header
