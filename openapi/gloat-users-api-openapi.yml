info:
  title: Gloat Users API
  version: 0.1.0
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: gloat-authorization-openapi.yml, gloat-company-service-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Users
paths:
  /api/authorization/v1/users/{user_id}:
    get:
      tags:
      - Users
      summary: Get user by ID
      description: Return the permissions, role ids, and group ids for a user.
      operationId: get_user_api_authorization_v1_users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the user
          title: User Id
        description: The unique identifier of the user
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v1/users/applications:
    post:
      tags:
      - Users
      summary: Get Applications For Users
      description: Get applications assigned to a list of users with pagination support
      operationId: get_applications_for_users_api_company_v1_users_applications_post
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items per page (0 = no limit)
          default: 20
          title: Limit
        description: Number of items per page (0 = no limit)
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersApplicationsRequestBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApplicationsListSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
