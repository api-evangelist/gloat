          type: array
          title: Permissions
      type: object
      required:
      - id
      - roles
      - groups
      - permissions
      title: UserResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UserPermissionsResponse:
      properties:
        name:
          type: string
          title: Name
        target_groups:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Target Groups
        access:
          type: string
          title: Access
      type: object
      required:
      - name
      - access
      title: UserPermissionsResponse
    UserApplicationsListSchema:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserApplicationsData'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
        total_count:
          type: integer
          title: Total Count
        has_next:
          type: boolean
          title: Has Next
          readOnly: true
        page_count:
          type: integer
          title: Page Count
          readOnly: true
      type: object
      required:
      - items
      - page
      - limit
      - total_count
      - has_next
      - page_count
      title: UserApplicationsListSchema
    UserApplicationsData:
      properties:
        user_id:
          type: string
          title: User Id
        applications:
          items:
            $ref: '#/components/schemas/ApplicationPartialData'
          type: array
          title: Applications
      type: object
      required:
