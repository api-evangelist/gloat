      - applications
      title: UserApplicationsData
    UsersApplicationsRequestBody:
      properties:
        user_ids:
          items:
            type: string
          type: array
          title: User Ids
      type: object
      required:
      - user_ids
      title: UsersApplicationsRequestBody
    ApplicationPartialData:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        category:
          $ref: '#/components/schemas/ApplicationCategory'
        description:
          type: string
          title: Description
      type: object
      required:
      - id
      - name
      - category
      - description
      title: ApplicationPartialData
    ApplicationCategory:
      type: string
      enum:
      - Technologies
      - AI Agents
      - AI Assistance
      title: ApplicationCategory
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
