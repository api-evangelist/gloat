openapi: 3.2.0
info:
  title: Skills foundation > File Download API
  version: 1.0.0
tags:
- name: Skills foundation > File Download
paths:
  /api/skills-foundation/file-download/files:
    get:
      tags:
      - Skills foundation > File Download
      summary: List Downloadable Files
      description: Retrieve a list of all available downloadable files for a specified file type.
      operationId: list_downloadable_files_api_v2__company__file_download_files_get
      parameters:
      - name: fileType
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FileDownloadType'
          description: The type of the downloadable files to list
        description: The type of the downloadable files to list
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDownloadRead'
                title: Response List Downloadable Files Api V2  Company  File Download Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/file-download/files/latest/download-url:
    get:
      tags:
      - Skills foundation > File Download
      summary: Get Last File Download Url
      description: Retrieve the download URL for the most recently uploaded file of a specified file type.
      operationId: get_last_file_download_url_api_v2__company__file_download_files_latest_download_url_get
      parameters:
      - name: fileType
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FileDownloadType'
          description: The type of the file
        description: The type of the file
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadURLRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/file-download/files/{task_id}/download-url:
    get:
      tags:
      - Skills foundation > File Download
      summary: Get File Download Url
      description: 'Retrieve the download URL for a specific file download task.

        A file download task should first be initiated at `/api/skills-foundation'
      operationId: get_file_download_url_api_v2__company__file_download_files__task_id__download_url_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          description: 'The ID of the file download task, returned in: `/api/skills-foundation/file-download/trigger` - `id` field'
          title: Task Id
        description: 'The ID of the file download task, returned in: `/api/skills-foundation/file-download/trigger` - `id` field'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadURLRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/file-download/trigger:
    post:
      tags:
      - Skills foundation > File Download
      summary: Trigger File Download
      description: 'As file generation is a resource-intensive task, it must be initiated asynchronously.

        This endpoint triggers a new file download task and returns a task ID.

        The file type should be specified in the request body to indicate the type of file to be downloaded.'
      operationId: trigger_file_download_api_v2__company__file_download_trigger_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_trigger_file_download_api_v2__company__file_download_trigger_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    FileDownloadType:
      type: string
      enum:
      - job-architecture
      - management-console
      - ai-index
      title: FileDownloadType
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DownloadURLRead:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
      - url
      title: DownloadURLRead
    Body_trigger_file_download_api_v2__company__file_download_trigger_post:
      properties:
        file_type:
          $ref: '#/components/schemas/FileDownloadType'
          description: The type of the file to download
      type: object
      required:
      - file_type
      title: Body_trigger_file_download_api_v2__company__file_download_trigger_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    FileDownloadRead:
      properties:
        id:
          anyOf:
          - type: string
            example: 5eb7cf5a86d9755df3a6c593
          - type: 'null'
          title: Id
        fileType:
          type: string
          title: Filetype
        createdAt:
          type: string
          format: date-time
          title: Createdat
        status:
          type: string
          title: Status
        isDownloadable:
          type: boolean
          title: Isdownloadable
          default: false
      type: object
      required:
      - id
      - fileType
      - createdAt
      - status
      title: FileDownloadRead
