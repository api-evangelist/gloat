openapi: 3.2.0
info:
  title: Gloat Customer Core Entities API
  description: This document covers the data models and the APIs exposed by Gloat.
  contact:
    email: naama.b@gloat.com
  version: 1.0.0
servers:
- url: https://api.gloat.com/api/v2
security:
- ApiKeyAuth: []
tags:
- name: Core Entities
paths:
  /departments:
    delete:
      tags:
      - Core Entities
      summary: Delete Departments
      description: Delete departments - by ID, by name, or all
      operationId: departmentBulkDelete
      parameters:
      - name: all
        in: query
        schema:
          type: string
      - name: id
        in: query
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: name
        in: query
        schema:
          type: array
          items:
            type: string
        explode: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  stats:
                    type: object
                    example: 5
      x-codegen-request-body-name: departments
      x-operation-id-source: normalized
      x-operation-id-original: department bulk delete
  /functions:
    post:
      tags:
      - Core Entities
      summary: Insert functions (bulk)
      description: Create functions and sub-functions
      operationId: functionBulkInsert
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                functions:
                  type: array
                  description: Array of function objects
                  items:
                    $ref: '#/components/schemas/function_object'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  stats:
                    type: object
                    example:
                      preexisting_functions: 5
                      preexisting_subfunctions: 30
                      received: 1
                      received_existing: 1
                      created: 1
                      updated_name: 3
                      parent: 4
                      updated: 1
      x-codegen-request-body-name: functions
      x-operation-id-source: normalized
      x-operation-id-original: function bulk insert
  /locations:
    post:
      tags:
      - Core Entities
      summary: Insert locations (bulk)
      description: Create locations (a.k.a. sites)
      operationId: locationBulkInsert
      requestBody:
        content:
          application/json:
            schema:
              required:
              - locations
              type: object
              properties:
                locations:
                  type: array
                  description: Array of location objects
                  items:
                    $ref: '#/components/schemas/location_object'
                updateExisting:
                  type: boolean
                  description: If true, existing location IDs would be updated to reflect the latest info. If false, only new locations would be created, but existing ones would not be updated even if their information is different.
                  default: false
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  stats:
                    type: object
                    example:
                      preexisting: 3
                      newly_mapped: 10
                      existed: 2
                      failed: 1
                      invalid_countries: 1
      x-codegen-request-body-name: locations
      x-operation-id-source: normalized
      x-operation-id-original: location bulk insert
components:
  schemas:
    location_object:
      type: object
      required:
      - external_id
      - source
      - is_active
      - is_remote
      properties:
        external_id:
          type: string
          example: id123
        source:
          type: string
          example: workday
        is_active:
          type: boolean
          example: true
        is_remote:
          type: boolean
          example: false
        display_name:
          type: string
          example: London, UK
        city:
          type: string
          example: London
        country:
          type: string
          example: England
        country_code:
          type: string
          example: UK
        state:
          type: string
        region:
          type: string
        googlable_name:
          type: string
    function_object:
      type: object
      required:
      - id
      - name
      - parent_id
      properties:
        id:
          type: string
          example: id123
        name:
          type: string
          example: function
        parent_id:
          type: string
          example: pid123
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-Gloat-API-Key
      in: header
