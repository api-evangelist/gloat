info:
  title: Skills Foundation Stats API
  version: 1.0.0
tags:
- name: Stats
paths:
  /api/skills-foundation/v1/stats/tag-usage:
    post:
      tags:
      - Stats
      summary: Get Tag Usage
      description: 'Get usage counts for skills across job architecture entities.


        This endpoint is used by the Ontology Service to count how many times

        skills are used in job families, job codes, and job titles.


        Returns separate counts for each entity type that uses the skill.

        Only returns counts > 0 (omits skills with no usage).'
      operationId: get_tag_usage_api_v2__company__v1_stats_tag_usage_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUsageCountRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagUsageCountResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
