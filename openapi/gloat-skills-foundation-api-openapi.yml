openapi: 3.1.0
info:
  title: Skills Foundation API
  version: 1.0.0
paths:
  /api/skills-foundation/file-download/files:
    get:
      tags:
      - Skills foundation > File Download
      summary: List Downloadable Files
      description: Retrieve a list of all available downloadable files for a specified file type.
      operationId: list_downloadable_files_api_v2__company__file_download_files_get
      parameters:
      - name: fileType
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FileDownloadType'
          description: The type of the downloadable files to list
        description: The type of the downloadable files to list
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileDownloadRead'
                title: Response List Downloadable Files Api V2  Company  File Download Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/file-download/files/latest/download-url:
    get:
      tags:
      - Skills foundation > File Download
      summary: Get Last File Download Url
      description: Retrieve the download URL for the most recently uploaded file of a specified file type.
      operationId: get_last_file_download_url_api_v2__company__file_download_files_latest_download_url_get
      parameters:
      - name: fileType
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FileDownloadType'
          description: The type of the file
        description: The type of the file
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadURLRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/file-download/files/{task_id}/download-url:
    get:
      tags:
      - Skills foundation > File Download
      summary: Get File Download Url
      description: 'Retrieve the download URL for a specific file download task.

        A file download task should first be initiated at `/api/skills-foundation'
      operationId: get_file_download_url_api_v2__company__file_download_files__task_id__download_url_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          description: 'The ID of the file download task, returned in: `/api/skills-foundation/file-download/trigger` - `id` field'
          title: Task Id
        description: 'The ID of the file download task, returned in: `/api/skills-foundation/file-download/trigger` - `id` field'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadURLRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/file-download/trigger:
    post:
      tags:
      - Skills foundation > File Download
      summary: Trigger File Download
      description: 'As file generation is a resource-intensive task, it must be initiated asynchronously.

        This endpoint triggers a new file download task and returns a task ID.

        The file type should be specified in the request body to indicate the type of file to be downloaded.'
      operationId: trigger_file_download_api_v2__company__file_download_trigger_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_trigger_file_download_api_v2__company__file_download_trigger_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/insights/suggest:
    post:
      tags:
      - Job Architecture > Job Code > Insights
      summary: Suggest Job Codes From Description
      description: Suggest job codes based on a description.
      operationId: suggest_job_codes_from_description_api_v2__company__job_architecture_insights_suggest_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestJobCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobBuilderSuggestions'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes:
    get:
      tags:
      - Job Architecture > Job Code
      summary: List Job Codes
      description: 'Retrieve a list of job codes.


        ### Filters:

        - **genaiImpact**: Filter by GenAI impact level. Accepts a list. Valid values: ''low'', ''moderate'', ''high'', ''full'''
      operationId: list_job_codes_api_v2__company__job_architecture_job_codes_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Pagesize
      - name: search
        in: query
        required: false
        schema:
          type: string
          description: 'Search for any match in fields: code, name (title). Case insensitive.'
          default: ''
          title: Search
        description: 'Search for any match in fields: code, name (title). Case insensitive.'
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JobCodeSortOptions'
          description: Field to sort by
          default: code
        description: Field to sort by
      - name: sortDir
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: Sort direction, either `asc` or `desc`
          default: asc
          title: Sortdir
        description: Sort direction, either `asc` or `desc`
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Status'
          description: Filter by job code status
          default: Active
        description: Filter by job code status
      - name: familyIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by job family IDs
          title: Familyids
        description: Filter by job family IDs
      - name: businessStatus
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BusinessStatus'
          description: Filter by business status
          title: Businessstatus
        description: Filter by business status
      - name: genaiImpact
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/GenAIImpactLevel'
          - type: 'null'
          description: Filter by GenAI impact level
          title: Genaiimpact
        description: Filter by GenAI impact level
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodesPaginationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Job Architecture > Job Code
      summary: Create Job Code
      description: Create a new job code.
      operationId: create_job_code_api_v2__company__job_architecture_job_codes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCodeCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes/skills/bulk:
    patch:
      tags:
      - Job Architecture > Job Code
      summary: Bulk patch skill proficiency levels
      description: "Update skill proficiency levels for multiple job codes in a single request.\n\n## Request\n- List of job codes with skills to update\n- Each skill requires a name and new proficiency level\n- Levels must be valid for the company configuration\n\n## Response (207 Multi-Status)\nReturns detailed results per job code with:\n- Success counts (updated, skipped)\n- Errors (not_found skills, detail message)\n- Status codes (200=success, 206=partial, 404=not found)\n\n## Example\n```json\n{\n  \"updates\": [\n    {\n      \"code\": \"JC001\",\n      \"skills\": [{\"name\": \"Python\", \"level\": 3}, {\"name\": \"SQL\", \"level\": 2}]\n    }\n  ]\n}\n```"
      operationId: bulk_patch_job_code_skills_api_v2__company__job_architecture_job_codes_skills_bulk_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest_JobCodeSkillProficiencyPatch_'
        required: true
      responses:
        '200':
          description: All items succeeded
        '207':
          description: Per‑item results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse_JobCodePatchResult_'
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: No WRITE permission
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: All items failed
  /api/skills-foundation/job-architecture/job-codes/tasks/automation-status/bulk:
    patch:
      tags:
      - Job Architecture > Job Code
      - Job Architecture > Job Code > Tasks
      summary: Bulk update task automation status
      description: 'Update automation status for multiple tasks across multiple job codes.


        This endpoint allows bulk updates of task automation levels, affecting

        Net AI Impact calculations. The score is calculated at query time based on

        the status using the AUTOMATION_STATUS_SCORES mapping.'
      operationId: bulk_update_task_automation_status_api_v2__company__job_architecture_job_codes_tasks_automation_status_bulk_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTaskAutomationStatusRequest'
        required: true
      responses:
        '200':
          description: All updates succeeded
        '207':
          description: Mixed results (some succeeded, some failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskAutomationStatusResponse'
        '400':
          description: Bad request or all updates failed with client errors (404, validation errors, etc.)
        '401':
          description: Unauthenticated
        '403':
          description: No WRITE permission
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: All updates failed with server errors
  /api/skills-foundation/job-architecture/job-codes/{job_code_id}:
    get:
      tags:
      - Job Architecture > Job Code
      summary: Get Job Code
      description: 'Retrieve a single job code by its ID.

        ### Note: The job''s description is not included and must be retrieved separately at:

        `/api/skills-foundation/job-architecture/job-codes/{job_code_id}/description`'
      operationId: get_job_code_api_v2__company__job_architecture_job_codes__job_code_id__get
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the job code to retrieve
          title: Job Code Id
        description: The ID of the job code to retrieve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Job Architecture > Job Code
      summary: Update Job Code
      description: 'Update an existing job code.

        If only the description needs updating, use `/api/skills-foundation/job-architecture/job-codes/{job_code_id}/description` instead.'
      operationId: update_job_code_api_v2__company__job_architecture_job_codes__job_code_id__patch
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the job code to update
          title: Job Code Id
        description: The ID of the job code to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCodeWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Job Architecture > Job Code
      summary: Delete Job Code
      description: Delete a job code by its ID.
      operationId: delete_job_code_api_v2__company__job_architecture_job_codes__job_code_id__delete
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the job code to delete
          title: Job Code Id
        description: The ID of the job code to delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes/{job_code_id}/description:
    get:
      tags:
      - Job Architecture > Job Code
      summary: Get Job Code Description
      description: Retrieve the description of a job code.
      operationId: get_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_get
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The Job Code ID of which to retrieve the description
          title: Job Code Id
        description: The Job Code ID of which to retrieve the description
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Job Architecture > Job Code
      summary: Update Job Code Description
      description: Update the description of a job code.
      operationId: update_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_put
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The Job Code ID of which to update the description
          title: Job Code Id
        description: The Job Code ID of which to update the description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_update_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes/{job_code_id}/similar:
    get:
      tags:
      - Job Architecture > Job Code
      summary: Get Similar Job Codes
      description: Retrieves job codes within the same job family as the provided job code.
      operationId: get_similar_job_codes_api_v2__company__job_architecture_job_codes__job_code_id__similar_get
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The Job Code ID of which to retrieve similar job codes
          title: Job Code Id
        description: The Job Code ID of which to retrieve similar job codes
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Pagesize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobCodeRead'
                title: Response Get Similar Job Codes Api V2  Company  Job Architecture Job Codes  Job Code Id  Similar Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-families:
    get:
      tags:
      - Job Architecture > Job Family
      summary: List Job Families
      description: Retrieve a list of job families.
      operationId: list_job_families_api_v2__company__job_architecture_job_families_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Pagesize
      - name: search
        in: query
        required: false
        schema:
          type: string
          description: Search for any match in name field (case-insensitive)
          default: ''
          title: Search
        description: Search for any match in name field (case-insensitive)
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JobFamilySortOptions'
          description: Field to sort by
          default: name
        description: Field to sort by
      - name: sortDir
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: Sort direction, either `asc` or `desc`
          default: asc
          title: Sortdir
        description: Sort direction, either `asc` or `desc`
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Status'
          description: Filter by job family status
          default: Active
        description: Filter by job family status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFamiliesPaginationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Job Architecture > Job Family
      summary: Create Job Family
      description: Create a new job family.
      operationId: create_job_family_api_v2__company__job_architecture_job_families_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobFamilyWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFamilyRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-families/{job_family_id}:
    get:
      tags:
      - Job Architecture > Job Family
      summary: Get Job Family
      description: Retrieve a single job family by its ID.
      operationId: get_job_family_api_v2__company__job_architecture_job_families__job_family_id__get
      parameters:
      - name: job_family_id
        in: path
        required: true
        schema:
          type: string
          title: Job Family Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFamilyRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Job Architecture > Job Family
      summary: Update Job Family
      description: 'Update an existing job family.

        If only the description needs updating, use `/api/skills-foundation/job-architecture/job-families/{job_family_id}/description` instead.'
      operationId: update_job_family_api_v2__company__job_architecture_job_families__job_family_id__patch
      parameters:
      - name: job_family_id
        in: path
        required: true
        schema:
          type: string
          title: Job Family Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobFamilyWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFamilyRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Job Architecture > Job Family
      summary: Delete Job Family
      description: 'Delete a job family by its ID.

        This will cascade delete all related job codes and job titles.'
      operationId: delete_job_family_api_v2__company__job_architecture_job_families__job_family_id__delete
      parameters:
      - name: job_family_id
        in: path
        required: true
        schema:
          type: string
          title: Job Family Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-families/{job_family_id}/description:
    get:
      tags:
      - Job Architecture > Job Family
      summary: Get Job Family Description
      description: Retrieve the description of a job family.
      operationId: get_job_family_description_api_v2__company__job_architecture_job_families__job_family_id__description_get
      parameters:
      - name: job_family_id
        in: path
        required: true
        schema:
          type: string
          title: Job Family Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Job Architecture > Job Family
      summary: Update Job Family Description
      description: Update the description of a job family.
      operationId: update_job_family_description_api_v2__company__job_architecture_job_families__job_family_id__description_put
      parameters:
      - name: job_family_id
        in: path
        required: true
        schema:
          type: string
          title: Job Family Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_update_job_family_description_api_v2__company__job_architecture_job_families__job_family_id__description_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFamilyRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-functions/autocomplete:
    get:
      tags:
      - Job Architecture > Job Function
      summary: Get Job Functions Autocomplete
      description: 'Autocomplete endpoint for job functions.

        Returns sorted distinct function values from active job codes.'
      operationId: get_job_functions_autocomplete_api_v2__company__job_architecture_job_functions_autocomplete_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Search query for filtering job functions
          default: ''
          title: Q
        description: Search query for filtering job functions
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1000
            minimum: 1
          - type: 'null'
          description: Maximum number of results to return
          title: Limit
        description: Maximum number of results to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                title: Response Get Job Functions Autocomplete Api V2  Company  Job Architecture Job Functions Autocomplete Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-titles:
    get:
      tags:
      - Job Architecture > Position Title
      summary: Get Job Titles
      description: 'Retrieve a list of position titles.

