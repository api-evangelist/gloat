          title: Id
        code:
          type: string
          title: Code
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - code
      title: SimpleJobCodeResponse
    SimpleJobCodeResponse-Output:
      properties:
        id:
          anyOf:
          - type: string
            example: 5eb7cf5a86d9755df3a6c593
          - type: 'null'
          title: Id
        code:
          type: string
          title: Code
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - code
