openapi: 3.2.0
info:
  title: Skills Foundation Job Architecture > Position Title API
  version: 1.0.0
tags:
- name: Job Architecture > Position Title
paths:
  /api/skills-foundation/job-architecture/job-titles:
    get:
      tags:
      - Job Architecture > Position Title
      summary: Get Job Titles
      description: 'Retrieve a list of position titles.

        ### Note: The returned description should not be used and must be retrieved separately at:

        `/api/skills-foundation/job-architecture/job-titles/{job_title_id}/description`'
      operationId: get_job_titles_api_v2__company__job_architecture_job_titles_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Pagesize
      - name: search
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Search
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JobTitleSortOptions'
          default: name
      - name: sortDir
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          default: asc
          title: Sortdir
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Status'
          default: Active
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Ids
      - name: jobCodeIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Jobcodeids
      - name: gradeLevels
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Gradelevels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTitlesPaginationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Job Architecture > Position Title
      summary: Create Job Title
      description: Create a new position title.
      operationId: create_job_title_api_v2__company__job_architecture_job_titles_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobTitleWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTitleRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-titles/{job_title_id}:
    get:
      tags:
      - Job Architecture > Position Title
      summary: Get Job Title
      description: Retrieve a single position title by its ID.
      operationId: get_job_title_api_v2__company__job_architecture_job_titles__job_title_id__get
      parameters:
      - name: job_title_id
        in: path
        required: true
        schema:
          type: string
          title: Job Title Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTitleRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Job Architecture > Position Title
      summary: Update Job Title
      description: 'Update an existing position title.

        If only the description needs updating, use `/api/skills-foundation/job-architecture/job-titles/{job_title_id}/description` instead.'
      operationId: update_job_title_api_v2__company__job_architecture_job_titles__job_title_id__patch
      parameters:
      - name: job_title_id
        in: path
        required: true
        schema:
          type: string
          title: Job Title Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobTitleWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTitleRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Job Architecture > Position Title
      summary: Delete Job Title
      description: Delete a position title by its ID.
      operationId: delete_job_title_api_v2__company__job_architecture_job_titles__job_title_id__delete
      parameters:
      - name: job_title_id
        in: path
        required: true
        schema:
          type: string
          title: Job Title Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-titles/{job_title_id}/description:
    get:
      tags:
      - Job Architecture > Position Title
      summary: Get Job Title Description
      description: Retrieve a position title's description.
      operationId: get_job_title_description_api_v2__company__job_architecture_job_titles__job_title_id__description_get
      parameters:
      - name: job_title_id
        in: path
        required: true
        schema:
          type: string
          title: Job Title Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Job Architecture > Position Title
      summary: Update Job Title Description
      description: Update a position title's description.
      operationId: update_job_title_description_api_v2__company__job_architecture_job_titles__job_title_id__description_put
      parameters:
      - name: job_title_id
        in: path
        required: true
        schema:
          type: string
          title: Job Title Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_update_job_title_description_api_v2__company__job_architecture_job_titles__job_title_id__description_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTitleRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-titles/{job_title_id}/similar:
    get:
      tags:
      - Job Architecture > Position Title
      summary: Get Similar Job Codes
      description: Retrieves position titles within the same job family as the provided job title.
      operationId: get_similar_job_codes_api_v2__company__job_architecture_job_titles__job_title_id__similar_get
      parameters:
      - name: job_title_id
        in: path
        required: true
        schema:
          type: string
          title: Job Title Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Pagesize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobTitleRead'
                title: Response Get Similar Job Codes Api V2  Company  Job Architecture Job Titles  Job Title Id  Similar Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
