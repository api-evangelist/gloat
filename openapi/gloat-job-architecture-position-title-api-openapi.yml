          title: Tags
        entity:
          additionalProperties: true
          type: object
          title: Entity
        is_unknown_skill:
          type: boolean
          title: Is Unknown Skill
          readOnly: true
        name:
          type: string
          title: Name
          readOnly: true
      type: object
      required:
      - tags
      - is_unknown_skill
      - name
      title: SkillComponent
      description: "Represents a grouped skill component.\n\nAttributes:\n  - skill: The associated DisplayedTerm (if found).\n  - tags: A list of Tag objects grouped for this skill.\n  - entity: A dictionary containing additional merged entity data."
    JobTitleSortOptions:
      type: string
      enum:
      - name
      - title_id
      - grade_level
      title: JobTitleSortOptions
    DescriptionSource:
      type: string
      enum:
      - source
      - ai
      title: DescriptionSource
    Tag:
      properties:
        name:
          type: string
          title: Name
        language:
          type: string
          title: Language
      additionalProperties: true
      type: object
      required:
      - name
      - language
      title: Tag
      description: 'Represents a tag with basic attributes.


        The model accepts extra entity data beyond the defined fields, allowing for the inclusion of

        additional metadata without a strict format requirement.'
    SkillAPI:
      properties:
        name:
          type: string
          title: Name
        language:
          type: string
