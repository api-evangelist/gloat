          title: Hasnext
          default: false
        numResults:
          type: integer
          title: Numresults
          default: 0
        pageCount:
          type: integer
          title: Pagecount
          default: 0
      type: object
      title: JobTitlesPaginationResponse
    TaskSource:
      type: string
      enum:
