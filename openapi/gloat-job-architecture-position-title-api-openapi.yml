        source:
          $ref: '#/components/schemas/SkillSource'
          default: company
        importance:
          anyOf:
          - $ref: '#/components/schemas/ImportanceEnum'
          - type: 'null'
        entitySource:
          anyOf:
          - type: string
            enum:
            - job_title
            - job_code
            - job_family
          - type: 'null'
          title: Entitysource
        isDeleted:
          type: boolean
          title: Isdeleted
          default: false
        isCascaded:
          type: boolean
          title: Iscascaded
          default: false
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
        modifiedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Modifiedat
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        taxonomy:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxonomy
      type: object
      required:
      - name
      title: SkillAPI
      description: Skill model for API responses (GET) - no validation to support legacy data
    Status:
      type: string
      enum:
