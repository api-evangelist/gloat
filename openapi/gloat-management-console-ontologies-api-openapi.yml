openapi: 3.2.0
info:
  title: Skills Foundation Management Console > Ontologies API
  version: 1.0.0
tags:
- name: Management Console > Ontologies
paths:
  /api/skills-foundation/management-console/ontologies:
    post:
      tags:
      - Management Console > Ontologies
      summary: Create Ontology
      description: Create a new ontology, which will, by default, be placed at the end of the preference list.
      operationId: create_ontology_api_v2__company__management_console_ontologies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_create_ontology_api_v2__company__management_console_ontologies_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/management-console/ontologies/list:
    get:
      tags:
      - Management Console > Ontologies
      summary: Get Ontologies List
      description: List ontologies in the preferred order, with the first ontology representing the highest preference.
      operationId: get_ontologies_list_api_v2__company__management_console_ontologies_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOntologiesResponse'
  /api/skills-foundation/management-console/ontologies/preferred:
    put:
      tags:
      - Management Console > Ontologies
      summary: Update Preferred Ontologies
      description: 'Update preferred ontologies:

        ### All ontologies retrieved from `/api/skills-foundation/management-console/ontologies/list` should be sent in the desired order.

        The preferred order will follow the sequence provided in the list.

        ### (i.e., the first ontology in the list will be treated as the highest preference)


        If any ontologies are omitted, they will be placed at the bottom of the list in a random order.'
      operationId: update_preferred_ontologies_api_v2__company__management_console_ontologies_preferred_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_update_preferred_ontologies_api_v2__company__management_console_ontologies_preferred_put'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    OntologyObject:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        isUploadAllowed:
          type: boolean
          title: Isuploadallowed
          default: true
      type: object
      required:
      - id
      - name
      title: OntologyObject
    Body_create_ontology_api_v2__company__management_console_ontologies_post:
      properties:
        ontology_name:
          type: string
          title: Ontology Name
      type: object
      required:
      - ontology_name
      title: Body_create_ontology_api_v2__company__management_console_ontologies_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ListOntologiesResponse:
      properties:
        ontologies:
          items:
            $ref: '#/components/schemas/OntologyObject'
          type: array
          title: Ontologies
          default: []
      type: object
      title: ListOntologiesResponse
    Body_update_preferred_ontologies_api_v2__company__management_console_ontologies_preferred_put:
      properties:
        ontologies:
          items:
            $ref: '#/components/schemas/BaseOntologyObject'
          type: array
          title: Ontologies
      type: object
      required:
      - ontologies
      title: Body_update_preferred_ontologies_api_v2__company__management_console_ontologies_preferred_put
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    BaseOntologyObject:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: BaseOntologyObject
