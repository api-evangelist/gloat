openapi: 3.2.0
info:
  title: Skills Foundation Job Architecture > Job Code API
  version: 1.0.0
tags:
- name: Job Architecture > Job Code
paths:
  /api/skills-foundation/job-architecture/job-codes:
    get:
      tags:
      - Job Architecture > Job Code
      summary: List Job Codes
      description: 'Retrieve a list of job codes.


        ### Filters:

        - **genaiImpact**: Filter by GenAI impact level. Accepts a list. Valid values: ''low'', ''moderate'', ''high'', ''full'''
      operationId: list_job_codes_api_v2__company__job_architecture_job_codes_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Pagesize
      - name: search
        in: query
        required: false
        schema:
          type: string
          description: 'Search for any match in fields: code, name (title). Case insensitive.'
          default: ''
          title: Search
        description: 'Search for any match in fields: code, name (title). Case insensitive.'
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JobCodeSortOptions'
          description: Field to sort by
          default: code
        description: Field to sort by
      - name: sortDir
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: Sort direction, either `asc` or `desc`
          default: asc
          title: Sortdir
        description: Sort direction, either `asc` or `desc`
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Status'
          description: Filter by job code status
          default: Active
        description: Filter by job code status
      - name: familyIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by job family IDs
          title: Familyids
        description: Filter by job family IDs
      - name: businessStatus
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/BusinessStatus'
          description: Filter by business status
          title: Businessstatus
        description: Filter by business status
      - name: genaiImpact
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/GenAIImpactLevel'
          - type: 'null'
          description: Filter by GenAI impact level
          title: Genaiimpact
        description: Filter by GenAI impact level
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodesPaginationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Job Architecture > Job Code
      summary: Create Job Code
      description: Create a new job code.
      operationId: create_job_code_api_v2__company__job_architecture_job_codes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCodeCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes/skills/bulk:
    patch:
      tags:
      - Job Architecture > Job Code
      summary: Bulk patch skill proficiency levels
      description: 'Update skill proficiency levels for multiple job codes in a single request.


        ## Request

        - List of job codes with skills to update

        - Each skill requires a name and new proficiency level

        - Levels must be valid for the company configuration


        ## Response (207 Multi-Status)

        Returns detailed results per job code with:

        - Success counts (updated, skipped)

        - Errors (not_found skills, detail message)

        - Status codes (200=success, 206=partial, 404=not found)


        ## Example

        ```json

        {

        "updates": [

        {

        "code": "JC001",

        "skills": [{"name": "Python", "level": 3}, {"name": "SQL", "level": 2}]

        }

        ]

        }

        ```'
      operationId: bulk_patch_job_code_skills_api_v2__company__job_architecture_job_codes_skills_bulk_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest_JobCodeSkillProficiencyPatch_'
        required: true
      responses:
        '200':
          description: All items succeeded
        '207':
          description: Per‑item results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse_JobCodePatchResult_'
        '400':
          description: Bad request
        '401':
          description: Unauthenticated
        '403':
          description: No WRITE permission
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: All items failed
  /api/skills-foundation/job-architecture/job-codes/tasks/automation-status/bulk:
    patch:
      tags:
      - Job Architecture > Job Code
      summary: Bulk update task automation status
      description: 'Update automation status for multiple tasks across multiple job codes.


        This endpoint allows bulk updates of task automation levels, affecting

        Net AI Impact calculations. The score is calculated at query time based on

        the status using the AUTOMATION_STATUS_SCORES mapping.'
      operationId: bulk_update_task_automation_status_api_v2__company__job_architecture_job_codes_tasks_automation_status_bulk_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTaskAutomationStatusRequest'
        required: true
      responses:
        '200':
          description: All updates succeeded
        '207':
          description: Mixed results (some succeeded, some failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTaskAutomationStatusResponse'
        '400':
          description: Bad request or all updates failed with client errors (404, validation errors, etc.)
        '401':
          description: Unauthenticated
        '403':
          description: No WRITE permission
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: All updates failed with server errors
  /api/skills-foundation/job-architecture/job-codes/{job_code_id}:
    get:
      tags:
      - Job Architecture > Job Code
      summary: Get Job Code
      description: 'Retrieve a single job code by its ID.

        ### Note: The job''s description is not included and must be retrieved separately at:

        `/api/skills-foundation/job-architecture/job-codes/{job_code_id}/description`'
      operationId: get_job_code_api_v2__company__job_architecture_job_codes__job_code_id__get
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the job code to retrieve
          title: Job Code Id
        description: The ID of the job code to retrieve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Job Architecture > Job Code
      summary: Update Job Code
      description: 'Update an existing job code.

        If only the description needs updating, use `/api/skills-foundation/job-architecture/job-codes/{job_code_id}/description` instead.'
      operationId: update_job_code_api_v2__company__job_architecture_job_codes__job_code_id__patch
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the job code to update
          title: Job Code Id
        description: The ID of the job code to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCodeWrite'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Job Architecture > Job Code
      summary: Delete Job Code
      description: Delete a job code by its ID.
      operationId: delete_job_code_api_v2__company__job_architecture_job_codes__job_code_id__delete
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the job code to delete
          title: Job Code Id
        description: The ID of the job code to delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes/{job_code_id}/description:
    get:
      tags:
      - Job Architecture > Job Code
      summary: Get Job Code Description
      description: Retrieve the description of a job code.
      operationId: get_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_get
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The Job Code ID of which to retrieve the description
          title: Job Code Id
        description: The Job Code ID of which to retrieve the description
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Job Architecture > Job Code
      summary: Update Job Code Description
      description: Update the description of a job code.
      operationId: update_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_put
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The Job Code ID of which to update the description
          title: Job Code Id
        description: The Job Code ID of which to update the description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_update_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCodeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/skills-foundation/job-architecture/job-codes/{job_code_id}/similar:
    get:
      tags:
      - Job Architecture > Job Code
      summary: Get Similar Job Codes
      description: Retrieves job codes within the same job family as the provided job code.
      operationId: get_similar_job_codes_api_v2__company__job_architecture_job_codes__job_code_id__similar_get
      parameters:
      - name: job_code_id
        in: path
        required: true
        schema:
          type: string
          description: The Job Code ID of which to retrieve similar job codes
          title: Job Code Id
        description: The Job Code ID of which to retrieve similar job codes
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Pagesize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobCodeRead'
                title: Response Get Similar Job Codes Api V2  Company  Job Architecture Job Codes  Job Code Id  Similar Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BulkResponse_JobCodePatchResult_:
      properties:
        results:
          items:
            $ref: '#/components/schemas/JobCodePatchResult'
          type: array
          title: Results
      type: object
      required:
      - results
      title: BulkResponse[JobCodePatchResult]
    DescriptionResponse:
      properties:
        type:
          anyOf:
          - type: string
            enum:
            - ai
            - source
          - type: 'null'
          title: Type
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - type
      - description
      title: DescriptionResponse
    CompensationRange:
      properties:
        min:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min
        max:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
          default: USD
      type: object
      title: CompensationRange
    TaskJobCodeAutomationResult:
      properties:
        jobCodeId:
          type: string
          title: Jobcodeid
          description: Job code ID
        taskId:
          type: string
          title: Taskid
          description: Task ID
        status:
          type: integer
          title: Status
          description: HTTP status code (200 = success, 404 = not found, etc.)
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Error detail if status is not 200
        automationStatus:
          anyOf:
          - $ref: '#/components/schemas/TaskAutomationStatusRead'
          - type: 'null'
          description: Updated automation status (only on success)
      type: object
      required:
      - jobCodeId
      - taskId
      - status
      title: TaskJobCodeAutomationResult
      description: 'Result for a single task-job_code automation status update.


        Contains HTTP status code, optional error detail, and the automation status on success.'
    GenAIImpactLevel:
      type: string
      enum:
      - low
      - moderate
      - high
      - full
      title: GenAIImpactLevel
    BulkTaskAutomationStatusRequest:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/TaskAutomationStatusBulkUpdate'
          type: array
          minItems: 1
          title: Tasks
          description: List of tasks to update (at least 1 required)
      type: object
      required:
      - tasks
      title: BulkTaskAutomationStatusRequest
    SkillComponent-Output:
      properties:
        skill:
          anyOf:
          - $ref: '#/components/schemas/DisplayedTerm'
          - type: 'null'
        tags:
          items:
            $ref: '#/components/schemas/Tag'
          type: array
          title: Tags
        entity:
          additionalProperties: true
          type: object
          title: Entity
        is_unknown_skill:
          type: boolean
          title: Is Unknown Skill
          readOnly: true
        name:
          type: string
          title: Name
          readOnly: true
      type: object
      required:
      - tags
      - is_unknown_skill
      - name
      title: SkillComponent
      description: "Represents a grouped skill component.\n\nAttributes:\n  - skill: The associated DisplayedTerm (if found).\n  - tags: A list of Tag objects grouped for this skill.\n  - entity: A dictionary containing additional merged entity data."
    JobCodeWrite:
      properties:
        skills:
          anyOf:
          - items:
              $ref: '#/components/schemas/SkillAPIWrite'
            type: array
          - type: 'null'
          title: Skills
        tasks:
          anyOf:
          - items:
              $ref: '#/components/schemas/TaskInput'
            type: array
          - type: 'null'
          title: Tasks
        skillComponents:
          anyOf:
          - items:
              $ref: '#/components/schemas/SkillComponent-Input'
            type: array
          - type: 'null'
          title: Skillcomponents
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        benchmarkTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Benchmarktitle
        family:
          anyOf:
          - $ref: '#/components/schemas/JobCodeFamilyAPI-Input'
          - type: 'null'
        function:
          anyOf:
          - type: string
          - type: 'null'
          title: Function
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        descriptionSource:
          anyOf:
          - $ref: '#/components/schemas/DescriptionSource'
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
        businessStatus:
          anyOf:
          - $ref: '#/components/schemas/BusinessStatus'
          - type: 'null'
        compensationRange:
          anyOf:
          - $ref: '#/components/schemas/CompensationRange'
          - type: 'null'
        employeeCountByCountry:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Employeecountbycountry
          examples:
          - PH: 200
            US: 100
        competencies:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Competencies
        experiences:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Experiences
        extraData:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extradata
        jobType:
          anyOf:
          - $ref: '#/components/schemas/JobType'
          - type: 'null'
        employeeGlobalCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Employeeglobalcount
          description: Global employee count for the job code (behind the scences, this is distributed between geos)
      type: object
      title: JobCodeWrite
    DescriptionSource:
      type: string
      enum:
      - source
      - ai
      title: DescriptionSource
    Tag:
      properties:
        name:
          type: string
          title: Name
        language:
          type: string
          title: Language
      additionalProperties: true
      type: object
      required:
      - name
      - language
      title: Tag
      description: 'Represents a tag with basic attributes.


        The model accepts extra entity data beyond the defined fields, allowing for the inclusion of

        additional metadata without a strict format requirement.'
    BulkTaskAutomationStatusResponse:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/TaskAutomationBulkResult'
          type: array
          title: Tasks
          description: Results per task
        totalSuccess:
          type: integer
          title: Totalsuccess
          description: Total successful updates across all tasks
        totalFailures:
          type: integer
          title: Totalfailures
          description: Total failed updates across all tasks
      type: object
      required:
      - tasks
      - totalSuccess
      - totalFailures
      title: BulkTaskAutomationStatusResponse
    Status:
      type: string
      enum:
      - Active
      - Inactive
      - Draft
      title: Status
      description: a class represents the status
    SkillAPI:
      properties:
        name:
          type: string
          title: Name
        language:
          type: string
          title: Language
          default: en
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
        source:
          $ref: '#/components/schemas/SkillSource'
          default: company
        importance:
          anyOf:
          - $ref: '#/components/schemas/ImportanceEnum'
          - type: 'null'
        entitySource:
          anyOf:
          - type: string
            enum:
            - job_title
            - job_code
            - job_family
          - type: 'null'
          title: Entitysource
        isDeleted:
          type: boolean
          title: Isdeleted
          default: false
        isCascaded:
          type: boolean
          title: Iscascaded
          default: false
        createdAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Createdat
        modifiedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Modifiedat
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        taxonomy:
          anyOf:
          - type: string
          - type: 'null'
          title: Taxonomy
      type: object
      required:
      - name
      title: SkillAPI
      description: Skill model for API responses (GET) - no validation to support legacy data
    TaskAutomationStatusBulkUpdate:
      properties:
        taskId:
          type: string
          title: Taskid
          description: Task identifier (UUID from Ontology Service)
        status:
          $ref: '#/components/schemas/AutomationStatus'
          description: Automation status to apply
        jobCodes:
          items:
            $ref: '#/components/schemas/JobCodeAutomationUpdate'
          type: array
          minItems: 1
          title: Jobcodes
          description: List of job codes to update (at least 1 required)
      type: object
      required:
      - taskId
      - status
      - jobCodes
      title: TaskAutomationStatusBulkUpdate
    JobCodePatchResult:
      properties:
        status:
          type: integer
          maximum: 599
          minimum: 200
          title: Status
          description: HTTP status code for this operation
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Optional error message or additional details
        code:
          type: string
          title: Code
          description: Job code identifier
        updated:
          anyOf:
          - type: integer
          - type: 'null'
          title: Updated
          description: Number of skills successfully updated
        skipped:
          anyOf:
          - type: integer
          - type: 'null'
          title: Skipped
          description: Number of skills with unchanged levels
        not_found:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Not Found
          description: Skills that weren't found in the job code
      type: object
      required:
      - status
      - code
      title: JobCodePatchResult
      description: Result of a job code skills patch operation
    TaskSource:
      type: string
      enum:
      - company
      - enrichment
      title: TaskSource
    Body_update_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_put:
      properties:
        description:
          type: string
          title: Description
      type: object
      required:
      - description
      title: Body_update_job_code_description_api_v2__company__job_architecture_job_codes__job_code_id__description_put
    JobCodeCreate:
      properties:
        skills:
          anyOf:
          - items:
              $ref: '#/components/schemas/SkillAPIWrite'
            type: array
          - type: 'null'
          title: Skills
        tasks:
          anyOf:
          - items:
              $ref: '#/components/schemas/TaskInput'
            type: array
          - type: 'null'
          title: Tasks
        skillComponents:
          anyOf:
          - items:
              $ref: '#/components/schemas/SkillComponent-Input'
            type: array
          - type: 'null'
          title: Skillcomponents
        code:
          type: string
          title: Code
          description: Unique code for the job
        name:
          type: string
          title: Name
          description: Name / Title of the job
        benchmarkTitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Benchmarktitle
        family:
          anyOf:
          - $ref: '#/components/schemas/JobCodeFamilyAPI-Input'
          - type: 'null'
        function:
          anyOf:
          - type: string
          - type: 'null'
          title: Function
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        descriptionSource:
          anyOf:
          - $ref: '#/components/schemas/DescriptionSource'
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
          description: Status of the job
        businessStatus:
          anyOf:
          - $ref: '#/components/schemas/BusinessStatus'
          - type: 'null'
          description: Business status of the job
        compensationRange:
          anyOf:
          - $ref: '#/components/schemas/CompensationRange'
          - type: 'null'
        employeeCountByCountry:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Employeecountbycountry
          examples:
          - PH: 200
            US: 100
        competencies:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Competencies
        experiences:
