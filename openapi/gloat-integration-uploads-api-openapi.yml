openapi: 3.2.0
info:
  title: Company Service Integration uploads API
  version: 0.1.0
  description: Presigned HTTPS PUT URLs for uploading files to the integration (e.g. Boomi) S3 bucket under your company prefix. Requires the upload_users permission. Configure INTEGRATION_UPLOADS_BUCKET and IRSA s3:PutObject on that bucket.
tags:
- name: Integration uploads
  description: Presigned HTTPS PUT URLs for uploading files to the integration (e.g. Boomi) S3 bucket under your company prefix. Requires the upload_users permission. Configure INTEGRATION_UPLOADS_BUCKET and IRSA s3:PutObject on that bucket.
paths:
  /api/company/v1/integration-uploads/presigned-upload-url:
    post:
      tags:
      - Integration uploads
      summary: Create Presigned Integration Upload Url
      description: 'Mint a short-lived presigned **HTTPS PUT** URL for uploading one object to the integration

        bucket under `{company_slug}/...`. The client must PUT the file body to the returned URL.'
      operationId: create_presigned_integration_upload_url_api_company_v1_integration_uploads_presigned_upload_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedIntegrationUploadRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedIntegrationUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PresignedIntegrationUploadResponse:
      properties:
        url:
          type: string
          title: Url
        http_method:
          type: string
          title: Http Method
          default: PUT
        bucket:
          type: string
          title: Bucket
        key:
          type: string
          title: Key
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
        max_upload_bytes:
          type: integer
          title: Max Upload Bytes
      type: object
      required:
      - url
      - bucket
      - key
      - expires_in_seconds
      - max_upload_bytes
      title: PresignedIntegrationUploadResponse
    PresignedIntegrationUploadRequest:
      properties:
        relative_key:
          type: string
          minLength: 1
          title: Relative Key
          description: Path under the company prefix (no leading slash); must not contain '..'.
      type: object
      required:
      - relative_key
      title: PresignedIntegrationUploadRequest
      description: Body for minting a presigned S3 PUT URL under `{company_slug}/`.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
