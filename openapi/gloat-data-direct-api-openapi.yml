openapi: 3.2.0
info:
  title: Company Service Data direct API
  version: 0.1.0
  description: 'The Data Sharing API provides endpoints for accessing and downloading your Gloat data.

    The API enables to retrieve lists of available file types and generate pre-signed URLs for downloading specific data files.

    Note that in order to access use this API you''ll need to create an API key via the Admin area and contact your Gloat representative to ask for permissions for the Data Direct API.'
tags:
- name: Data direct
  description: 'The Data Sharing API provides endpoints for accessing and downloading your Gloat data.

    The API enables to retrieve lists of available file types and generate pre-signed URLs for downloading specific data files.

    Note that in order to access use this API you''ll need to create an API key via the Admin area and contact your Gloat representative to ask for permissions for the Data Direct API.'
paths:
  /api/company/v1/data-direct/file-types:
    get:
      tags:
      - Data direct
      summary: Get File Types
      description: List available file types (some split into dimension/fact tables).
      operationId: get_file_types_api_company_v1_data_direct_file_types_get
      security:
      - HTTPBearer: []
      parameters:
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                title: Response Get File Types Api Company V1 Data Direct File Types Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/company/v1/data-direct/presigned-urls:
    get:
      tags:
      - Data direct
      summary: Get File Name Presigned Urls
      description: Generate a pre-signed URL for downloading a specific file within a date range.
      operationId: get_file_name_presigned_urls_api_company_v1_data_direct_presigned_urls_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_name
        in: query
        required: true
        schema:
          type: string
          title: File Name
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Start date in ISO format (YYYY-MM-DD)
          title: Start
        description: Start date in ISO format (YYYY-MM-DD)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: End date in ISO format (YYYY-MM-DD)
          title: End
        description: End date in ISO format (YYYY-MM-DD)
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlsResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/company/v1/data-direct/presigned-urls/all:
    get:
      tags:
      - Data direct
      summary: Get All File Names Presigned Urls
      description: Generate pre-signed URLs for downloading all files within a date range.
      operationId: get_all_file_names_presigned_urls_api_company_v1_data_direct_presigned_urls_all_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Start date in ISO format (YYYY-MM-DD)
          title: Start
        description: Start date in ISO format (YYYY-MM-DD)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: End date in ISO format (YYYY-MM-DD)
          title: End
        description: End date in ISO format (YYYY-MM-DD)
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlsAllResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/company/v1/data-direct/trigger/{flow}:
    post:
      tags:
      - Data direct
      summary: Trigger Dag Flow
      description: Trigger the MWAA DAG for `flow` (per-company flag gated + rate limited, see module notes).
      operationId: trigger_dag_flow_api_company_v1_data_direct_trigger__flow__post
      security:
      - HTTPBearer: []
      parameters:
      - name: flow
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DataDirectFlow'
      - name: validate_company_exists
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Validate Company Exists
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DagTriggerResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DagTriggerResponseModel:
      properties:
        flow:
          $ref: '#/components/schemas/DataDirectFlow'
        runs:
          items:
            $ref: '#/components/schemas/DagTriggerResultModel'
          type: array
          title: Runs
      type: object
      required:
      - flow
      - runs
      title: DagTriggerResponseModel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PresignedUrlsResponseModel:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PresignedUrlEntryModel'
          type: array
          title: Items
      type: object
      required:
      - items
      title: PresignedUrlsResponseModel
    PresignedUrlsAllResponseModel:
      properties:
        catalog:
          $ref: '#/components/schemas/PresignedUrlsResponseModel'
          default:
            items: []
        dim:
          $ref: '#/components/schemas/PresignedUrlsResponseModel'
          default:
            items: []
        fact:
          $ref: '#/components/schemas/PresignedUrlsResponseModel'
          default:
            items: []
      type: object
      title: PresignedUrlsAllResponseModel
    DataDirectFlow:
      type: string
      enum:
      - data-direct
      - downloadable-reports
      title: DataDirectFlow
      description: Trigger-able MWAA flows (RADIOHEAD-73). Maps to staging dag_ids below.
    PresignedUrlEntryModel:
      properties:
        file_name:
          type: string
          title: File Name
        url:
          type: string
          title: Url
      type: object
      required:
      - file_name
      - url
      title: PresignedUrlEntryModel
    DagTriggerResultModel:
      properties:
        dag_id:
          type: string
          title: Dag Id
        run_id:
          type: string
          title: Run Id
        state:
          type: string
          title: State
        newly_triggered:
          type: boolean
          title: Newly Triggered
      type: object
      required:
      - dag_id
      - run_id
      - state
      - newly_triggered
      title: DagTriggerResultModel
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
