openapi: 3.2.0
info:
  title: Gloat Customer User Profile API
  description: This document covers the data models and the APIs exposed by Gloat.
  contact:
    email: naama.b@gloat.com
  version: 1.0.0
servers:
- url: https://api.gloat.com/api/v2
security:
- ApiKeyAuth: []
tags:
- name: User Profile
paths:
  /user_profile/training:
    post:
      tags:
      - User Profile
      summary: Insert user training records
      description: Upload training records for user profile
      requestBody:
        description: Object with ids as keys and array of records as a value
        content:
          application/json:
            schema:
              type: object
              properties:
                user_training:
                  type: object
                  properties:
                    <user_id>:
                      type: array
                      description: Array of training objects
                      items:
                        $ref: '#/components/schemas/training'
        required: true
      responses:
        '200':
          description: Successful Upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  training_result:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      stats:
                        type: object
                        example:
                          total_training_records: 2
                          training_created: 1
                          training_failed: 1
                          total_num_of_users: 2
                          invalid_users: 1
        '400':
          description: Integration failed, missing data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Training upload failed
      operationId: postUserProfileTraining
      x-operation-id-source: derived
components:
  schemas:
    training:
      type: object
      required:
      - user_id
      - course_name
      - start_date
      properties:
        course_name:
          type: string
          example: Python
        start_date:
          type: string
          example: '2020-05-28'
        end_date:
          type: string
          example: '2020-12-30'
        institution:
          type: string
          example: udemy
        type:
          type: string
          example: online
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-Gloat-API-Key
      in: header
